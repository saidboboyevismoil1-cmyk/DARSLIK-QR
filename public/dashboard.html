<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EduFocus</title>
<style>body{font:17px system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;margin:0;background:#eef1ff;color:#0f172a}a{color:#4338ca}</style>
</head>
<body>
<p>EduFocus… <a href="/teacher/">/teacher/</a></p>
<script>
// Yangi o'qituvchi paneliga yo'naltirish. Eski sahifa (edufocus_token) orqali kirgan bo'lsa — seansni yangi panelga ko'chiramiz.
(function () {
  function go() { location.replace('/teacher/'); }
  try {
    var old = localStorage.getItem('edufocus_token');
    if (old && !localStorage.getItem('ef_t_refresh')) {
      fetch('/api/auth/exchange', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + old }, body: '{}' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (d) {
          if (d && d.refreshToken) {
            localStorage.setItem('ef_t_remember', 'true');
            localStorage.setItem('ef_t_token', d.token); localStorage.setItem('ef_t_refresh', d.refreshToken);
            localStorage.setItem('ef_t_teacher', JSON.stringify(d.teacher));
          }
          go();
        }).catch(go);
      return;
    }
  } catch (e) { /* */ }
  go();
})();
</script>
</body>
</html>
