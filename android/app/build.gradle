import groovy.json.JsonSlurper

plugins {
    id 'com.android.application'
}

// Server manzili bitta joyda: ../config/app-config.json  (yoki -PserverUrl=https://... bilan almashtiriladi)
def appConfig = new JsonSlurper().parse(file('../../config/app-config.json'))
def prodUrl = project.findProperty('serverUrl') ?: appConfig.productionUrl
def devUrl  = project.findProperty('serverUrl') ?: appConfig.androidEmulatorUrl

// Imzolash: android/keystore.properties bo'lsa — release kaliti, bo'lmasa debug kaliti ishlatiladi
def keystoreProps = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) keystoreFile.withInputStream { keystoreProps.load(it) }

android {
    namespace = 'com.edufocus.app'
    compileSdk = 34

    defaultConfig {
        applicationId = "com.edufocus.app"
        minSdk = 21
        targetSdk = 34
        versionCode = 40
        versionName = "4.0.0"
        buildConfigField 'String', 'START_PATH', "\"${appConfig.startPath}\""
    }

    buildFeatures {
        buildConfig = true
    }

    signingConfigs {
        release {
            if (keystoreProps['storeFile']) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            } else {
                initWith signingConfigs.debug
            }
        }
    }

    buildTypes {
        debug {
            buildConfigField 'String', 'SERVER_URL', "\"${devUrl}\""
        }
        release {
            buildConfigField 'String', 'SERVER_URL', "\"${prodUrl}\""
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.core:core-splashscreen:1.0.1'
}
